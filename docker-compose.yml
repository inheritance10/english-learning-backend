version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: langlearn_postgres
    environment:
      POSTGRES_USER: lang_user
      POSTGRES_PASSWORD: test123
      POSTGRES_DB: langlearn_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - langlearn_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lang_user -d langlearn_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: langlearn_redis
    command: redis-server --requirepass redispassword
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - langlearn_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: langlearn_backend
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - langlearn_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

networks:
  langlearn_net:
    driver: bridge
